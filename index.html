<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stryde Elite - Pro Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .active-tab { border-bottom: 4px solid #2563eb; color: #2563eb; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .event-input { border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 11px; font-weight: bold; width: 100%; text-align: center; }
        .label-xs { font-[9px] font-black uppercase text-slate-400 mb-1 block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-xl">
        <div class="p-4 flex justify-between items-center border-b border-slate-800">
            <h1 class="font-black italic tracking-tighter text-xl text-blue-400">STRYDE ELITE PRO</h1>
            <div class="flex gap-4 items-center">
                <button onclick="emailAllWorkouts()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-lg transition">Email Blast ✉️</button>
                <div class="flex bg-slate-800 rounded-lg p-1">
                    <button onclick="switchView('builder')" id="nav-builder" class="text-[10px] font-black uppercase px-4 py-2 rounded-md active-tab">Builder</button>
                    <button onclick="switchView('roster')" id="nav-roster" class="text-[10px] font-black uppercase px-4 py-2 rounded-md">Roster & PRs</button>
                </div>
            </div>
        </div>
        <div class="bg-white p-3 border-b flex gap-3 overflow-x-auto shadow-inner" id="weekRibbon"></div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <aside class="w-full lg:w-72 shrink-0">
            <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Selected Day's Groups</h2>
            <div id="sideRoster" class="space-y-3"></div>
        </aside>

        <section class="flex-1">
            <div id="view-builder" class="space-y-6">
                <div class="card border-t-4 border-blue-600">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-[10px] font-black text-slate-400 uppercase">1. Select Runners</h2>
                        <button onclick="toggleAllCheckboxes()" class="text-[9px] font-bold text-blue-600">SELECT ALL</button>
                    </div>
                    <div id="checklist" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-8 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-xl border"></div>
                    <h2 class="text-[10px] font-black text-slate-400 uppercase mb-2">2. Training Plan</h2>
                    <input type="text" id="workMain" placeholder="Main Set" class="w-full p-4 border-2 border-slate-100 rounded-xl font-bold text-lg mb-4 outline-none focus:border-blue-500">
                    <button onclick="saveWorkout()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg transition active:scale-95">ASSIGN WORKOUT</button>
                </div>
            </div>

            <div id="view-roster" class="hidden space-y-6">
                <div class="card bg-slate-900 text-white border-none shadow-2xl">
                    <h2 id="form-title" class="font-black text-blue-400 mb-6 uppercase italic text-sm">Add New Athlete</h2>
                    <input type="hidden" id="edit-id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <div class="md:col-span-2">
                            <span class="label-xs">Full Name</span>
                            <input type="text" id="run-name" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold">
                        </div>
                        <div>
                            <span class="label-xs">Grade</span>
                            <select id="run-grade" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold">
                                <option>9th</option><option>10th</option><option>11th</option><option>12th</option><option>College</option>
                            </select>
                        </div>
                        <div>
                            <span class="label-xs">Years Exp.</span>
                            <input type="number" id="run-years" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div><span class="label-xs">Email</span><input type="email" id="run-email" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white"></div>
                        <div>
                            <span class="label-xs">Seasons</span>
                            <div class="flex gap-4 mt-2">
                                <label class="text-[10px] font-black flex items-center gap-1"><input type="checkbox" id="s-xc"> XC</label>
                                <label class="text-[10px] font-black flex items-center gap-1 text-blue-300"><input type="checkbox" id="s-w"> WTR</label>
                                <label class="text-[10px] font-black flex items-center gap-1 text-emerald-300"><input type="checkbox" id="s-s"> SPR</label>
                            </div>
                        </div>
                    </div>

                    <span class="label-xs border-t border-slate-700 pt-4">Event Personal Bests</span>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-3 mt-2">
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">100m</span><input type="text" id="pr-100" class="event-input bg-slate-800 border-none text-white"></div>
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">200m</span><input type="text" id="pr-200" class="event-input bg-slate-800 border-none text-white"></div>
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">400m</span><input type="text" id="pr-400" class="event-input bg-slate-800 border-none text-white"></div>
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">800m</span><input type="text" id="pr-800" class="event-input bg-slate-800 border-none text-white"></div>
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">1600m</span><input type="text" id="pr-1600" class="event-input bg-slate-800 border-none text-white"></div>
                        <div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">3200m</span><input type="text" id="pr-3200" class="event-input bg-slate-800 border-none text-white"></div>
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button onclick="addRunner()" id="save-btn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black text-xs hover:bg-blue-500 transition">SAVE ATHLETE</button>
                        <button onclick="clearForm()" class="text-slate-500 font-bold text-[10px] uppercase">Cancel / Clear</button>
                    </div>
                </div>

                <div id="rosterList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>

    <script>
        let selDate = new Date().toISOString().split('T')[0];
        const eventList = ['100', '200', '400', '800', '1600', '3200'];

        function switchView(view) {
            document.getElementById('view-builder').classList.toggle('hidden', view !== 'builder');
            document.getElementById('view-roster').classList.toggle('hidden', view !== 'roster');
            document.getElementById('nav-builder').classList.toggle('active-tab', view === 'builder');
            document.getElementById('nav-roster').classList.toggle('active-tab', view === 'roster');
            renderAll();
        }

        function addRunner() {
            const name = document.getElementById('run-name').value;
            const editId = document.getElementById('edit-id').value;
            if(!name) return alert("Name is required");

            let runners = JSON.parse(localStorage.getItem('runners') || "[]");
            
            const prs = {};
            eventList.forEach(ev => prs[ev] = document.getElementById('pr-'+ev).value);

            const athleteData = {
                id: editId ? parseInt(editId) : Date.now(),
                name,
                email: document.getElementById('run-email').value,
                grade: document.getElementById('run-grade').value,
                years: document.getElementById('run-years').value,
                seasons: { xc: document.getElementById('s-xc').checked, w: document.getElementById('s-w').checked, s: document.getElementById('s-s').checked },
                prs: prs
            };

            if(editId) {
                runners = runners.map(r => r.id === athleteData.id ? athleteData : r);
            } else {
                runners.push(athleteData);
            }

            localStorage.setItem('runners', JSON.stringify(runners));
            clearForm();
            renderAll();
        }

        function editAthlete(id) {
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            const r = runners.find(item => item.id === id);
            if(!r) return;

            document.getElementById('edit-id').value = r.id;
            document.getElementById('run-name').value = r.name;
            document.getElementById('run-email').value = r.email;
            document.getElementById('run-grade').value = r.grade;
            document.getElementById('run-years').value = r.years;
            document.getElementById('s-xc').checked = r.seasons?.xc;
            document.getElementById('s-w').checked = r.seasons?.w;
            document.getElementById('s-s').checked = r.seasons?.s;
            
            eventList.forEach(ev => {
                document.getElementById('pr-'+ev).value = r.prs ? r.prs[ev] : '';
            });

            document.getElementById('form-title').innerText = "Editing: " + r.name;
            document.getElementById('save-btn').innerText = "UPDATE ATHLETE";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRunner(id) {
            if(!confirm("Delete runner?")) return;
            let runners = JSON.parse(localStorage.getItem('runners') || "[]").filter(r => r.id !== id);
            localStorage.setItem('runners', JSON.stringify(runners));
            renderAll();
        }

        function clearForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('run-name').value = '';
            document.getElementById('run-email').value = '';
            document.getElementById('run-years').value = '';
            eventList.forEach(ev => document.getElementById('pr-'+ev).value = '');
            ['s-xc','s-w','s-s'].forEach(id => document.getElementById(id).checked = false);
            document.getElementById('form-title').innerText = "Add New Athlete";
            document.getElementById('save-btn').innerText = "SAVE ATHLETE";
        }

        function saveWorkout() {
            const checked = document.querySelectorAll('.run-check:checked');
            const main = document.getElementById('workMain').value;
            if(!checked.length || !main) return alert("Select runners and enter workout.");

            let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            checked.forEach(box => {
                workouts.unshift({ date: selDate, name: box.value, main: main });
            });
            localStorage.setItem('workouts', JSON.stringify(workouts));
            document.getElementById('workMain').value = '';
            renderAll();
        }

        function renderAll() {
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]");

            // Render Roster List
            document.getElementById('rosterList').innerHTML = runners.map(r => `
                <div class="card border-l-4 border-blue-500">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[10px] font-black text-blue-600 uppercase tracking-tighter">${r.grade} • ${r.years || 0} YRS EXP</span>
                            <div class="font-black text-lg uppercase">${r.name}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editAthlete(${r.id})" class="bg-slate-100 p-2 rounded text-[9px] font-black hover:bg-blue-100 transition">EDIT</button>
                            <button onclick="deleteRunner(${r.id})" class="bg-slate-100 p-2 rounded text-[9px] font-black text-red-500 hover:bg-red-50 transition">DEL</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-6 gap-1 bg-slate-50 p-2 rounded-lg mb-3">
                        ${eventList.map(ev => `<div class="text-center"><div class="text-[7px] font-black text-slate-400 uppercase">${ev}m</div><div class="text-[9px] font-bold">${r.prs?.[ev] || '--'}</div></div>`).join('')}
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-1">
                            ${r.seasons?.xc ? '<span class="bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded text-[7px] font-black">XC</span>' : ''}
                            ${r.seasons?.w ? '<span class="bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded text-[7px] font-black">WTR</span>' : ''}
                            ${r.seasons?.s ? '<span class="bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[7px] font-black">SPR</span>' : ''}
                        </div>
                        <div class="text-[8px] font-bold text-slate-400">${r.email || ''}</div>
                    </div>
                </div>
            `).join('');

            // Render Builder Checklist
            document.getElementById('checklist').innerHTML = runners.map(r => `
                <label class="flex items-center gap-2 p-3 bg-white border rounded-xl text-[10px] font-black cursor-pointer shadow-sm">
                    <input type="checkbox" class="run-check" value="${r.name}"> ${r.name}
                </label>
            `).join('');

            // Render Ribbon
            const ribbon = document.getElementById('weekRibbon'); ribbon.innerHTML = '';
            let start = new Date(); start.setDate(start.getDate() - 3);
            for(let i=0; i<7; i++) {
                let d = new Date(start); d.setDate(d.getDate() + i);
                let dStr = d.toISOString().split('T')[0];
                let dayWork = workouts.find(w => w.date === dStr);
                const card = document.createElement('div');
                card.className = `min-w-[120px] p-3 rounded-xl border-2 cursor-pointer bg-white transition ${dStr === selDate ? 'border-blue-500 bg-blue-50' : 'border-slate-100'}`;
                card.onclick = () => { selDate = dStr; renderAll(); };
                card.innerHTML = `<div class="text-[9px] font-black text-slate-400 uppercase">${d.toLocaleDateString(undefined, {weekday:'short', day:'numeric'})}</div>
                                  <div class="text-[10px] font-bold truncate mt-1">${dayWork ? dayWork.main : 'OFF'}</div>`;
                ribbon.appendChild(card);
            }

            // Render Side Groups
            const todaysWorkouts = workouts.filter(w => w.date === selDate);
            document.getElementById('sideRoster').innerHTML = todaysWorkouts.map(w => `
                <div class="p-3 bg-white border rounded-xl border-l-4 border-blue-500 shadow-sm text-[11px] font-bold">
                    <span class="text-blue-600">${w.name}:</span> ${w.main}
                </div>
            `).join('') || '<p class="text-xs text-slate-400 italic">No activity selected.</p>';
        }

        function toggleAllCheckboxes() {
            const boxes = document.querySelectorAll('.run-check');
            const all = Array.from(boxes).every(b => b.checked);
            boxes.forEach(b => b.checked = !all);
        }

        function emailAllWorkouts() {
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]").filter(w => w.date === selDate);
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            if(!workouts.length) return alert("No workouts today.");
            workouts.forEach(w => {
                const r = runners.find(item => item.name === w.name);
                if(r?.email) window.open(`mailto:${r.email}?subject=Workout&body=Workout for ${w.date}: ${w.main}`, '_blank');
            });
        }

        renderAll();
    </script>
</body>
</html>
