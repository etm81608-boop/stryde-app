<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stryde Elite - Master Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .day-card { min-width: 160px; transition: 0.2s; cursor: pointer; border-width: 2px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; }
        .active-day { border-color: #2563eb; background-color: #eff6ff; box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.2); }
        .module-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
        .label-caps { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
        .hidden { display: none; }
        .tab-btn { padding: 12px 24px; font-weight: 800; font-size: 12px; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-active { border-bottom-color: #2563eb; color: #2563eb; }
        .checklist-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.1s; }
        .checklist-item:hover { background: #f1f5f9; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .workout-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 10px; line-height: 1.2; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 overflow-hidden">

    <nav class="bg-white border-b sticky top-0 z-30 shadow-sm">
        <div class="px-6 py-2 bg-slate-900 text-white flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
            <span>⚡ Stryde Elite Command Center</span>
            <div class="flex gap-6">
                <button onclick="changeWeek(-7)" class="hover:text-blue-400">◀ Previous Week</button>
                <span id="weekDisplay" class="text-blue-400 italic font-black"></span>
                <button onclick="changeWeek(7)" class="hover:text-blue-400">Next Week ▶</button>
            </div>
        </div>
        <div class="flex bg-white px-6 border-b justify-between items-center">
            <div class="flex">
                <button id="btn-view-builder" onclick="switchView('builder')" class="tab-btn tab-active">WORKOUT BUILDER</button>
                <button id="btn-view-roster" onclick="switchView('roster')" class="tab-btn">TEAM DATABASE</button>
            </div>
            <div class="flex gap-4 items-center">
                <span class="text-[10px] font-black text-slate-400 uppercase">Focus: <span id="viewingRunner" class="text-blue-600 italic">All Runners</span></span>
                <button onclick="emailAllWorkouts()" class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-lg hover:bg-blue-700 transition">Email Blast ✉️</button>
            </div>
        </div>
        <div id="weeklyRibbon" class="flex overflow-x-auto p-3 gap-3 bg-slate-50 border-b shadow-inner"></div>
    </nav>

    <div class="flex flex-col lg:flex-row h-[calc(100vh-215px)]">
        
        <aside class="w-full lg:w-80 bg-white border-r overflow-y-auto p-5 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="label-caps !mb-0">Today's Roster</h2>
                <span id="rosterCount" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-black">0</span>
            </div>
            <div id="sideRoster" class="space-y-3"></div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            
            <div id="view-builder" class="max-w-3xl mx-auto space-y-6">
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
                    <div class="space-y-3">
                        <div class="flex justify-between items-end px-1">
                            <label class="label-caps !text-blue-600">1. Select Runners</label>
                            <div class="flex gap-3 text-[9px] font-black uppercase">
                                <button onclick="selectAll(true)" class="text-blue-500">All</button>
                                <button onclick="selectAll(false)" class="text-slate-400">None</button>
                            </div>
                        </div>
                        <div id="athleteChecklist" class="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-40 overflow-y-auto p-4 border rounded-2xl bg-slate-50/50"></div>
                    </div>

                    <div class="space-y-4">
                        <label class="label-caps !text-blue-600">2. Workout Details</label>
                        <div class="module-card border-blue-100 bg-blue-50/30">
                            <input type="text" id="manDist" placeholder="Main Set (e.g. 12x200m @ 30s)" class="w-full p-3 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-400">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="module-card"><label class="label-caps">Warmup</label><input type="text" id="warmup" class="w-full bg-transparent font-bold text-xs border-b border-slate-200 outline-none"></div>
                            <div class="module-card"><label class="label-caps text-purple-500">Lift</label><input type="text" id="lift" class="w-full bg-transparent font-bold text-xs border-b border-slate-200 outline-none"></div>
                            <div class="module-card"><label class="label-caps text-emerald-500">Cooldown</label><input type="text" id="cooldown" class="w-full bg-transparent font-bold text-xs border-b border-slate-200 outline-none"></div>
                        </div>
                    </div>
                    <button onclick="saveWorkout()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-black uppercase text-sm tracking-widest">Assign Workout</button>
                </div>
            </div>

            <div id="view-roster" class="hidden max-w-5xl mx-auto space-y-8">
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                    <h2 class="text-xl font-black mb-6 text-blue-600 uppercase italic">Add New Runner</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <input type="text" id="db-name" placeholder="Name" class="p-3 border rounded-xl font-bold">
                        <input type="email" id="db-email" placeholder="Email" class="p-3 border rounded-xl">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <input type="number" id="db-years" placeholder="Years Running" class="p-3 border rounded-xl">
                        <input type="text" id="db-events" placeholder="Primary Events" class="p-3 border rounded-xl">
                    </div>
                    <textarea id="db-pbs" placeholder="Personal Bests..." class="w-full p-3 border rounded-xl h-20 mb-4"></textarea>
                    <div class="flex gap-6 p-4 bg-slate-50 rounded-xl mb-6">
                        <label class="text-xs font-bold flex items-center gap-2 cursor-pointer"><input type="checkbox" id="s-xc"> XC</label>
                        <label class="text-xs font-bold flex items-center gap-2 cursor-pointer"><input type="checkbox" id="s-winter"> Winter</label>
                        <label class="text-xs font-bold flex items-center gap-2 cursor-pointer"><input type="checkbox" id="s-spring"> Spring</label>
                    </div>
                    <button onclick="addAthlete()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-black uppercase text-xs shadow-md">Add Runner to Team</button>
                </div>
                <div id="db-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        let curStart = new Date();
        let selDate = new Date().toISOString().split('T')[0];
        let currentRunnerFilter = null;

        function switchView(view) {
            document.getElementById('view-builder').classList.toggle('hidden', view !== 'builder');
            document.getElementById('view-roster').classList.toggle('hidden', view !== 'roster');
            document.getElementById('btn-view-builder').classList.toggle('tab-active', view === 'builder');
            document.getElementById('btn-view-roster').classList.toggle('tab-active', view === 'roster');
            if(view === 'builder') renderAthleteChecklist();
        }

        function setFocus(name) {
            currentRunnerFilter = name;
            document.getElementById('viewingRunner').innerText = name || "All Runners";
            renderWeek();
        }

        // DATABASE OPERATIONS
        function addAthlete() {
            const athlete = {
                id: Date.now(),
                name: document.getElementById('db-name').value,
                email: document.getElementById('db-email').value,
                years: document.getElementById('db-years').value,
                events: document.getElementById('db-events').value,
                pbs: document.getElementById('db-pbs').value,
                seasons: { xc: document.getElementById('s-xc').checked, winter: document.getElementById('s-winter').checked, spring: document.getElementById('s-spring').checked }
            };
            if(!athlete.name) return alert("Please enter a name.");
            let roster = JSON.parse(localStorage.getItem('myRoster') || "[]");
            roster.push(athlete);
            localStorage.setItem('myRoster', JSON.stringify(roster));
            renderRoster();
            renderAthleteChecklist();
            ['db-name','db-email','db-years','db-events','db-pbs'].forEach(id => document.getElementById(id).value = '');
            ['s-xc','s-winter','s-spring'].forEach(id => document.getElementById(id).checked = false);
        }

        function deleteAthlete(id) {
            if(!confirm("Are you sure you want to remove this runner?")) return;
            let roster = JSON.parse(localStorage.getItem('myRoster') || "[]").filter(a => a.id !== id);
            localStorage.setItem('myRoster', JSON.stringify(roster));
            if(currentRunnerFilter) setFocus(null);
            renderRoster(); renderAthleteChecklist();
        }

        function renderRoster() {
            const roster = JSON.parse(localStorage.getItem('myRoster') || "[]");
            document.getElementById('db-list').innerHTML = roster.map(a => `
                <div class="p-5 bg-white border border-slate-100 rounded-3xl shadow-sm border-l-8 border-blue-500 relative cursor-pointer hover:shadow-md transition" onclick="setFocus('${a.name}')">
                    <button onclick="event.stopPropagation(); deleteAthlete(${a.id})" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 font-bold text-lg">✕</button>
                    <div class="font-black uppercase text-sm mb-1">${a.name}</div>
                    <div class="text-[9px] text-blue-500 font-bold mb-2">${a.email || 'No Email'}</div>
                    <div class="text-[9px] text-slate-400 italic truncate mb-2">${a.pbs || 'No PRs listed'}</div>
                    <div class="flex gap-1">
                        ${a.seasons.xc ? '<span class="bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded text-[7px] font-black">XC</span>' : ''}
                        ${a.seasons.winter ? '<span class="bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded text-[7px] font-black">WTR</span>' : ''}
                        ${a.seasons.spring ? '<span class="bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[7px] font-black">SPR</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // WORKOUT OPERATIONS
        function renderAthleteChecklist() {
            const roster = JSON.parse(localStorage.getItem('myRoster') || "[]");
            document.getElementById('athleteChecklist').innerHTML = roster.map(a => `
                <label class="checklist-item"><input type="checkbox" class="athlete-cb" data-email="${a.email}" value="${a.name}"><span class="text-[11px] font-bold truncate">${a.name}</span></label>
            `).join('');
        }

        function selectAll(bool) { document.querySelectorAll('.athlete-cb').forEach(cb => cb.checked = bool); }

        function saveWorkout() {
            const selected = Array.from(document.querySelectorAll('.athlete-cb:checked')).map(cb => ({ name: cb.value, email: cb.dataset.email }));
            if(selected.length === 0) return alert("Select runners first!");
            const workout = { date: selDate, main: document.getElementById('manDist').value, warmup: document.getElementById('warmup').value, lift: document.getElementById('lift').value, cooldown: document.getElementById('cooldown').value };
            let history = JSON.parse(localStorage.getItem('myWorkouts') || "[]");
            selected.forEach(s => history.unshift({ ...workout, name: s.name, email: s.email }));
            localStorage.setItem('myWorkouts', JSON.stringify(history));
            document.querySelectorAll('.athlete-cb').forEach(cb => cb.checked = false);
            renderWeek();
        }

        function emailAllWorkouts() {
            const history = JSON.parse(localStorage.getItem('myWorkouts') || "[]");
            const todays = history.filter(w => w.date === selDate);
            todays.forEach(w => {
                const body = encodeURIComponent(`Workout for ${w.date}:\n\nWarmup: ${w.warmup}\nMain Set: ${w.main}\nLift: ${w.lift}\nCooldown: ${w.cooldown}`);
                window.open(`mailto:${w.email}?subject=Today's Workout&body=${body}`, '_blank');
            });
        }

        function changeWeek(d) { curStart.setDate(curStart.getDate() + d); renderWeek(); }

        function renderWeek() {
            const ribbon = document.getElementById('weeklyRibbon');
            ribbon.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('myWorkouts') || "[]");
            document.getElementById('weekDisplay').innerText = curStart.toLocaleDateString(undefined, {month:'short', day:'numeric'});

            for (let i = 0; i < 7; i++) {
                const day = new Date(curStart); day.setDate(day.getDate() + i);
                const dStr = day.toISOString().split('T')[0];
                const dayWorkouts = history.filter(h => h.date === dStr);
                const focus = currentRunnerFilter ? dayWorkouts.find(w => w.name === currentRunnerFilter) : dayWorkouts[0];
                
                const card = document.createElement('div');
                card.className = `day-card p-3 rounded-2xl bg-white border-2 ${dStr === selDate ? 'active-day shadow-md' : 'border-slate-50'}`;
                card.onclick = () => { selDate = dStr; renderWeek(); };
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[9px] font-black uppercase text-slate-400">${day.toLocaleDateString(undefined, {weekday:'short'})} ${day.getDate()}</span>
                        ${dayWorkouts.length > 1 ? `<span class="bg-blue-600 text-white text-[7px] px-1 rounded-full">+${dayWorkouts.length-1}</span>` : ''}
                    </div>
                    <div class="workout-text font-bold text-slate-700">${focus ? focus.main : '<span class="text-slate-200">Off</span>'}</div>
                    <div class="text-[7px] font-black text-blue-500 uppercase truncate">${focus && !currentRunnerFilter ? focus.name : ''}</div>
                `;
                ribbon.appendChild(card);
            }
            refreshSide();
        }

        function refreshSide() {
            const history = JSON.parse(localStorage.getItem('myWorkouts') || "[]");
            const todays = history.filter(w => w.date === selDate);
            document.getElementById('rosterCount').innerText = todays.length;
            const grouped = {};
            todays.forEach(w => {
                if(!grouped[w.main]) grouped[w.main] = { main: w.main, names: [] };
                grouped[w.main].names.push(w.name);
            });
            document.getElementById('sideRoster').innerHTML = Object.values(grouped).map(g => `
                <div class="p-3 bg-white border border-slate-100 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <div class="text-[10px] font-black text-blue-600 uppercase mb-2">🏃 ${g.main}</div>
                    <div class="flex flex-wrap gap-1">${g.names.map(n => `<span class="bg-slate-50 border border-slate-100 px-1.5 py-0.5 rounded text-[8px] font-bold text-slate-500">${n.split(' ')[0]}</span>`).join('')}</div>
                </div>
            `).join('');
        }

        renderRoster(); renderAthleteChecklist(); renderWeek();
    </script>
</body>
</html>
