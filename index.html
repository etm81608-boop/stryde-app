<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XC Team Manager</title>

<style>
/* ===== GENERAL STYLING ===== */
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
}

header {
  background: #1e3a8a;
  color: white;
  text-align: center;
  padding: 1rem;
}

/* ===== TAB NAVIGATION ===== */
.tabs {
  display: flex;
  background: #ddd;
}

.tabs button {
  flex: 1;
  padding: 10px;
  border: none;
  cursor: pointer;
}

.tabs .active {
  background: white;
  font-weight: bold;
}

/* ===== LAYOUT ===== */
.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}

input, select, textarea {
  width: 100%;
  margin: 6px 0 12px;
  padding: 8px;
}

button {
  padding: 8px 12px;
  cursor: pointer;
}

.hidden {
  display: none;
}

/* ===== CALENDAR ===== */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.calendar-day {
  border: 1px solid #ccc;
  padding: 6px;
  margin: 4px;
  min-height: 90px;
  font-size: 12px;
  overflow-y: auto;
  cursor: pointer;
}

/* ===== REPORT TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 6px;
}

td {
  padding: 6px;
  text-align: center;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
<h1>🏃 XC Team Manager</h1>
</header>

<!-- ===== TABS ===== -->
<div class="tabs">
<button onclick="showTab('roster')" class="active" id="rosterTab">Roster</button>
<button onclick="showTab('workouts')" id="workoutsTab">Workouts</button>
<button onclick="showTab('calendar')" id="calendarTab">Calendar</button>
<button onclick="showTab('reports')" id="reportsTab">Reports</button>
</div>

<div class="container">

<!-- ===== ROSTER ===== -->
<div id="roster">
<div class="card">
<h2>Add Athlete</h2>

<input id="name" placeholder="Name">

<select id="grade">
<option>6th</option><option>7th</option><option>8th</option>
<option>9th</option><option>10th</option><option>11th</option><option>12th</option>
</select>

<input id="years" type="number" placeholder="Years Running">
<input id="events" placeholder="Events">

<select id="seasons" multiple>
<option>Cross Country</option>
<option>Winter Track</option>
<option>Spring Track</option>
</select>

<button onclick="addAthlete()">Save Athlete</button>
</div>

<div class="card">
<h2>Roster</h2>
<div id="athleteList"></div>
</div>
</div>

<!-- ===== WORKOUTS ===== -->
<div id="workouts" class="hidden">
<div class="card">
<h2>Create Workout</h2>

<input id="wTitle" placeholder="Workout Title">
<input id="wDate" type="date">
<textarea id="wDesc" placeholder="Workout details"></textarea>

<select id="assignTo"></select>

<button onclick="addWorkout()">Save Workout</button>
</div>

<div class="card">
<h2>All Workouts</h2>
<div id="workoutList"></div>
</div>
</div>

<!-- ===== CALENDAR ===== -->
<div id="calendar" class="hidden">
<div class="card">
<h2>Calendar</h2>
<input type="month" id="monthPicker" onchange="renderCalendar()">
<div id="calendarGrid" class="calendar-grid"></div>
</div>

<div class="card">
<h2>Selected Day</h2>
<div id="dayDetails">Click a day</div>
</div>
</div>

<!-- ===== REPORTS ===== -->
<div id="reports" class="hidden">
<div class="card">
<h2>Generate Report</h2>

<label>Date (optional)</label>
<input type="date" id="reportDate">

<label>Athlete</label>
<select id="reportAthlete"></select>

<button onclick="generateReport()">Generate</button>
</div>

<div class="card">
<h2>Report Output</h2>
<div id="reportOutput"></div>
</div>
</div>

</div>

<script>

/* ===== DATA STORAGE ===== */
let athletes = JSON.parse(localStorage.getItem("athletes")) || [];
let workouts = JSON.parse(localStorage.getItem("workouts")) || [];

function save() {
  localStorage.setItem("athletes", JSON.stringify(athletes));
  localStorage.setItem("workouts", JSON.stringify(workouts));
}

/* ===== TAB SWITCHING ===== */
function showTab(tab) {
  ["roster","workouts","calendar","reports"].forEach(t=>{
    document.getElementById(t).classList.add("hidden");
    document.getElementById(t+"Tab").classList.remove("active");
  });

  document.getElementById(tab).classList.remove("hidden");
  document.getElementById(tab+"Tab").classList.add("active");
}

/* ===== ATHLETES ===== */
function addAthlete() {
  const seasons = [...document.getElementById("seasons").selectedOptions].map(o=>o.value);

  athletes.push({
    name: name.value,
    grade: grade.value,
    years: years.value,
    events: events.value,
    seasons
  });

  save();
  renderAthletes();
  updateDropdowns();
}

function renderAthletes() {
  athleteList.innerHTML = athletes.map((a,i)=>`
    <div class="card">
      <b>${a.name}</b><br>
      ${a.grade} | ${a.events}<br>
      <button onclick="deleteAthlete(${i})">Delete</button>
    </div>
  `).join("");
}

function deleteAthlete(i){
  athletes.splice(i,1);
  save();
  renderAthletes();
  updateDropdowns();
}

/* ===== WORKOUTS ===== */
function addWorkout(){
  workouts.push({
    title: wTitle.value,
    date: wDate.value,
    desc: wDesc.value,
    assign: assignTo.value
  });

  save();
  renderWorkouts();
}

function renderWorkouts(){
  workoutList.innerHTML = workouts.map((w,i)=>`
    <div class="card">
      <b>${w.title}</b> (${w.date})<br>
      ${w.desc}<br>
      Assigned: ${getAthleteName(w.assign)}
      <br><button onclick="editWorkout(${i})">Edit</button>
    </div>
  `).join("");
}

function editWorkout(i){
  const w = workouts[i];

  wTitle.value = w.title;
  wDate.value = w.date;
  wDesc.value = w.desc;
  assignTo.value = w.assign;

  workouts.splice(i,1);
  save();
  renderWorkouts();
}

/* ===== CALENDAR WITH ATHLETES DISPLAYED ===== */
function renderCalendar(){

  const month = monthPicker.value;
  if(!month) return;

  const [y,m] = month.split("-");
  const days = new Date(y,m,0).getDate();

  let html="";

  for(let d=1; d<=days; d++){

    let date = `${month}-${String(d).padStart(2,'0')}`;

    let dayWorkouts = workouts.filter(w=>w.date===date);

    let content = `<b>${d}</b><br>`;

    dayWorkouts.forEach(w=>{
      content += `
        <div>
          <b>${w.title}</b><br>
          ${getAthleteName(w.assign)}
        </div>
      `;
    });

    html += `
      <div class="calendar-day" onclick="showDay('${date}')">
        ${content}
      </div>
    `;
  }

  calendarGrid.innerHTML = html;
}

function showDay(date){
  let dayWorkouts = workouts.filter(w=>w.date===date);

  dayDetails.innerHTML = dayWorkouts.map((w,i)=>`
    <div class="card">
      <b>${w.title}</b><br>
      ${w.desc}<br>
      Assigned: ${getAthleteName(w.assign)}
      <br><button onclick="editWorkout(${i})">Edit</button>
    </div>
  `).join("") || "No workouts";
}

/* ===== REPORT TABLE (DATES AS COLUMNS) ===== */
function generateReport(){

  const selectedDate = reportDate.value;
  const selectedAthlete = reportAthlete.value;

  let filtered = workouts.filter(w=>{
    return (!selectedDate || w.date===selectedDate) &&
           (selectedAthlete==="all" || w.assign===selectedAthlete || w.assign==="all");
  });

  if(filtered.length===0){
    reportOutput.innerHTML="No results";
    return;
  }

  let dates = [...new Set(filtered.map(w=>w.date))];

  let athleteIndexes = selectedAthlete==="all"
    ? athletes.map((_,i)=>i)
    : [parseInt(selectedAthlete)];

  let html = `<table><tr><th>Athlete</th>`;

  dates.forEach(d=> html+=`<th>${d}</th>`);
  html += `</tr>`;

  athleteIndexes.forEach(i=>{
    html += `<tr><td><b>${athletes[i]?.name}</b></td>`;

    dates.forEach(d=>{
      let cell = filtered
        .filter(w=>w.date===d && (w.assign==i || w.assign==="all"))
        .map(w=>w.title)
        .join("<br>");

      html += `<td>${cell || "-"}</td>`;
    });

    html += `</tr>`;
  });

  html += `</table>`;

  reportOutput.innerHTML = html;
}

/* ===== HELPERS ===== */
function updateDropdowns(){
  assignTo.innerHTML='<option value="all">All Athletes</option>';
  reportAthlete.innerHTML='<option value="all">All Athletes</option>';

  athletes.forEach((a,i)=>{
    assignTo.innerHTML+=`<option value="${i}">${a.name}</option>`;
    reportAthlete.innerHTML+=`<option value="${i}">${a.name}</option>`;
  });
}

function getAthleteName(i){
  return i==="all" ? "All Athletes" : athletes[i]?.name || "Unknown";
}

/* ===== INITIAL LOAD ===== */
renderAthletes();
renderWorkouts();
updateDropdowns();

</script>

</body>
</html>
