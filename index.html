<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach's Running Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; color: var(--primary); }

        .form-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-weight: bold; }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover { opacity: 0.9; }

        .workout-item {
            border-left: 5px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
            border-radius: 0 8px 8px 0;
            position: relative;
        }

        .workout-date { font-size: 0.85rem; color: #64748b; }
        .workout-type { 
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏃‍♂️ Athlete Training Portal</h1>
        <p>Create and share workouts with your team.</p>
    </header>

    <div class="card">
        <h2>Create New Workout</h2>
        <div class="form-group">
            <label>Workout Title</label>
            <input type="text" id="title" placeholder="e.g. 5x1000m Intervals">
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="type">
                <option value="Intervals">Intervals</option>
                <option value="Long Run">Long Run</option>
                <option value="Tempo">Tempo</option>
                <option value="Recovery">Recovery</option>
            </select>
        </div>
        <div class="form-group">
            <label>Instructions</label>
            <textarea id="desc" rows="3" placeholder="Warm up 2 miles, then..."></textarea>
        </div>
        <button onclick="addWorkout()">Post to Dashboard</button>
    </div>

    <div class="card">
        <h2>Active Workout Feed</h2>
        <div id="workoutFeed">
            </div>
    </div>
</div>

<script>
    function addWorkout() {
        const title = document.getElementById('title').value;
        const type = document.getElementById('type').value;
        const desc = document.getElementById('desc').value;
        const date = new Date().toLocaleDateString();

        if(!title || !desc) {
            alert("Please fill out all fields!");
            return;
        }

        const feed = document.getElementById('workoutFeed');
        
        const workoutHTML = `
            <div class="workout-item">
                <span class="workout-type">${type}</span>
                <span class="workout-date">${date}</span>
                <h3>${title}</h3>
                <p>${desc}</p>
            </div>
        `;

        feed.insertAdjacentHTML('afterbegin', workoutHTML);

        // Clear inputs
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
    }
</script>

</body>
</html>
