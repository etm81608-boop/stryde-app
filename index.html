<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Coach Portal & Reporting</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #ef4444; --green: #16a34a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }
        
        nav { background: #1e293b; padding: 1rem; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        nav button { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        nav button.active { background: var(--primary); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }

        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        /* Reports Table */
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        .report-table th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .report-table th, .report-table td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        .report-table tr:nth-child(even) { background: #fdfdfd; }

        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #cbd5e1; border: 1px solid #cbd5e1; }
        .calendar-header { background: #334155; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 0.8rem; }
        .calendar-day { background: white; min-height: 130px; padding: 5px; position: relative; }
        .cal-workout-block { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 4px; margin-bottom: 4px; font-size: 0.75rem; cursor: pointer; }
        
        button.primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button.success { background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .share-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 8px; margin-top: 15px; word-break: break-all; font-family: monospace; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<nav>
    <button onclick="showPage('calendar')" id="btn-calendar" class="active">Calendar</button>
    <button onclick="showPage('workouts')" id="btn-workouts">Assign Workout</button>
    <button onclick="showPage('reports')" id="btn-reports">Reports & Share</button>
    <button onclick="showPage('athletes')" id="btn-athletes">Roster</button>
</nav>

<div class="container">
    
    <div id="page-calendar">
        <div class="card">
            <h2 id="monthLabel" style="text-align: center; margin-top: 0;"></h2>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <div id="page-workouts" class="hidden">
        <div class="card">
            <h2 id="w-form-title">Assign Workout</h2>
            <input type="date" id="w-date">
            <input type="text" id="w-title" placeholder="Workout Title">
            <textarea id="w-desc" rows="3" placeholder="Instructions..."></textarea>
            <label>Assign to Athletes:</label>
            <div id="athlete-selector" style="max-height:150px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-bottom:10px;"></div>
            <button class="primary" onclick="saveWorkout()">Save Workout</button>
        </div>
    </div>

    <div id="page-reports" class="hidden">
        <div class="card">
            <h2>Generate Training Report</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Start Date</label>
                    <input type="date" id="rep-start">
                </div>
                <div>
                    <label>End Date</label>
                    <input type="date" id="rep-end">
                </div>
            </div>
            <button class="primary" onclick="generateReport()">Generate Spreadsheet View</button>
            <button class="success" onclick="generateShareLink()">Create Shareable Link for Athletes</button>
            
            <div id="share-display" class="hidden">
                <p><strong>Copy this link to share with your team:</strong></p>
                <div class="share-box" id="link-url"></div>
            </div>
        </div>

        <div id="report-results" class="card hidden">
            <h3>Training Log</h3>
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Athlete</th>
                        <th>Workout</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="report-body"></tbody>
            </table>
        </div>
    </div>

    <div id="page-athletes" class="hidden">
        <div class="card">
            <h2>Add Athlete</h2>
            <input type="text" id="a-name" placeholder="Name">
            <input type="email" id="a-email" placeholder="Email">
            <button class="primary" onclick="saveAthlete()">Add to Roster</button>
        </div>
        <div class="card">
            <table id="athleteTable">
                <tbody id="athleteBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let athletes = JSON.parse(localStorage.getItem('roster')) || [];
    let workouts = JSON.parse(localStorage.getItem('trainingPlan')) || [];

    function showPage(id) {
        document.querySelectorAll('.container > div').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('active');
        if(id === 'calendar') renderCalendar();
        if(id === 'workouts') renderAthleteSelector();
        if(id === 'athletes') renderRoster();
    }

    // --- ATHLETE LOGIC ---
    function saveAthlete() {
        const name = document.getElementById('a-name').value;
        const email = document.getElementById('a-email').value;
        if(!name) return;
        athletes.push({name, email});
        localStorage.setItem('roster', JSON.stringify(athletes));
        document.getElementById('a-name').value = '';
        document.getElementById('a-email').value = '';
        renderRoster();
    }

    function renderRoster() {
        const body = document.getElementById('athleteBody');
        body.innerHTML = athletes.map((a, i) => `<tr><td>${a.name}</td><td>${a.email}</td></tr>`).join('');
    }

    function renderAthleteSelector() {
        const box = document.getElementById('athlete-selector');
        box.innerHTML = athletes.map(a => `<label style="display:block"><input type="checkbox" class="a-check" value="${a.name}"> ${a.name}</label>`).join('');
    }

    // --- WORKOUT LOGIC ---
    function saveWorkout() {
        const selected = Array.from(document.querySelectorAll('.a-check:checked')).map(c => c.value);
        const data = {
            date: document.getElementById('w-date').value,
            title: document.getElementById('w-title').value,
            desc: document.getElementById('w-desc').value,
            assigned: selected
        };
        if(!data.date || !data.title) return alert("Date and Title required");
        workouts.push(data);
        localStorage.setItem('trainingPlan', JSON.stringify(workouts));
        showPage('calendar');
    }

    // --- REPORT LOGIC ---
    function generateReport() {
        const start = document.getElementById('rep-start').value;
        const end = document.getElementById('rep-end').value;
        if(!start || !end) return alert("Select a date range");

        const reportBody = document.getElementById('report-body');
        reportBody.innerHTML = '';
        
        // Sort workouts by date
        const sorted = workouts.filter(w => w.date >= start && w.date <= end).sort((a,b) => a.date.localeCompare(b.date));

        sorted.forEach(w => {
            w.assigned.forEach(athleteName => {
                const row = `<tr>
                    <td>${w.date}</td>
                    <td><strong>${athleteName}</strong></td>
                    <td>${w.title}</td>
                    <td><small>${w.desc}</small></td>
                </tr>`;
                reportBody.innerHTML += row;
            });
        });

        document.getElementById('report-results').classList.remove('hidden');
    }

    // --- SHARE LOGIC ---
    function generateShareLink() {
        const start = document.getElementById('rep-start').value;
        const end = document.getElementById('rep-end').value;
        if(!start || !end) return alert("Select a date range first");

        // We encode the report data into the URL hash
        const filtered = workouts.filter(w => w.date >= start && w.date <= end);
        const dataString = btoa(JSON.stringify(filtered)); // Base64 encode
        const shareUrl = window.location.origin + window.location.pathname + "#view=" + dataString;

        document.getElementById('link-url').innerText = shareUrl;
        document.getElementById('share-display').classList.remove('hidden');
    }

    // Check if we are viewing a shared link
    window.onload = function() {
        if(window.location.hash.startsWith("#view=")) {
            const data = JSON.parse(atob(window.location.hash.split("=")[1]));
            document.body.innerHTML = `<div class="container">
                <div class="card">
                    <h1>Shared Training Schedule</h1>
                    <table class="report-table">
                        <thead><tr><th>Date</th><th>Athlete</th><th>Workout</th><th>Details</th></tr></thead>
                        <tbody>
                            ${data.flatMap(w => w.assigned.map(a => `<tr><td>${w.date}</td><td>${a}</td><td>${w.title}</td><td>${w.desc}</td></tr>`)).join('')}
                        </tbody>
                    </table>
                    <button class="primary" onclick="window.location.hash=''; location.reload();">Back to Coach Portal</button>
                </div>
            </div>`;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('monthLabel');
        const now = new Date();
        const month = now.getMonth();
        const year = now.getFullYear();

        label.innerText = now.toLocaleString('default', { month: 'long', year: 'numeric' });
        grid.innerHTML = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="calendar-header">${d}</div>`).join('');

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="calendar-day" style="background:#f1f5f9"></div>`;
        
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            let dayHtml = `<div class="calendar-day"><span class="day-num">${d}</span>`;
            workouts.forEach((w, index) => {
                if(w.date === dateStr) {
                    dayHtml += `<div class="cal-workout-block"><strong>${w.title}</strong><br><small>${w.assigned.join(', ')}</small></div>`;
                }
            });
            dayHtml += `</div>`;
            grid.innerHTML += dayHtml;
        }
    }

    showPage('calendar');
</script>
</body>
</html>
