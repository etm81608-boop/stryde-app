<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XC Team Manager</title>

<style>
body { font-family: Arial; margin:0; background:#f4f6f8; }
header { background:#1e3a8a; color:white; text-align:center; padding:1rem; }

.tabs { display:flex; background:#ddd; }
.tabs button { flex:1; padding:10px; border:none; cursor:pointer; }
.tabs .active { background:white; font-weight:bold; }

.container { padding:20px; }
.card { background:white; padding:15px; margin-bottom:15px; border-radius:8px; }

input, select, textarea { width:100%; margin:6px 0 12px; padding:8px; }
button { padding:8px 12px; margin:4px 2px; cursor:pointer; }

.hidden { display:none; }

.calendar-day {
  border:1px solid #ccc;
  padding:10px;
  margin:5px;
  cursor:pointer;
}

.calendar-grid {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
}
</style>
</head>

<body>

<header><h1>🏃 XC Team Manager</h1></header>

<div class="tabs">
<button onclick="showTab('roster')" class="active" id="rosterTab">Roster</button>
<button onclick="showTab('workouts')" id="workoutsTab">Workouts</button>
<button onclick="showTab('calendar')" id="calendarTab">Calendar</button>
<button onclick="showTab('reports')" id="reportsTab">Reports</button>
</div>

<div class="container">

<!-- ROSTER -->
<div id="roster">
<div class="card">
<h2>Add Athlete</h2>
<input id="name" placeholder="Name">
<select id="grade">
<option>6th</option><option>7th</option><option>8th</option>
<option>9th</option><option>10th</option><option>11th</option><option>12th</option>
</select>
<input id="years" type="number" placeholder="Years Running">
<input id="events" placeholder="Events">
<select id="seasons" multiple>
<option>Cross Country</option>
<option>Winter Track</option>
<option>Spring Track</option>
</select>
<button onclick="addAthlete()">Save Athlete</button>
</div>

<div class="card"><h2>Roster</h2><div id="athleteList"></div></div>
</div>

<!-- WORKOUTS -->
<div id="workouts" class="hidden">
<div class="card">
<h2>Create Workout</h2>
<input id="wTitle" placeholder="Workout Title">
<input id="wDate" type="date">
<textarea id="wDesc" placeholder="Workout"></textarea>
<select id="assignTo"></select>
<button onclick="addWorkout()">Save Workout</button>
</div>

<div class="card"><h2>All Workouts</h2><div id="workoutList"></div></div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="hidden">
<div class="card">
<h2>Calendar</h2>
<input type="month" id="monthPicker" onchange="renderCalendar()">
<div id="calendarGrid" class="calendar-grid"></div>
</div>

<div class="card">
<h2>Selected Day</h2>
<div id="dayDetails">Click a day</div>
</div>
</div>

<!-- REPORTS -->
<div id="reports" class="hidden">
<div class="card">
<h2>Generate Report</h2>

<label>Date</label>
<input type="date" id="reportDate">

<label>Athlete</label>
<select id="reportAthlete"></select>

<button onclick="generateReport()">Generate</button>
</div>

<div class="card">
<h2>Report Output</h2>
<div id="reportOutput"></div>
</div>
</div>

</div>

<script>
let athletes = JSON.parse(localStorage.getItem("athletes")) || [];
let workouts = JSON.parse(localStorage.getItem("workouts")) || [];

function save() {
localStorage.setItem("athletes", JSON.stringify(athletes));
localStorage.setItem("workouts", JSON.stringify(workouts));
}

function showTab(tab) {
["roster","workouts","calendar","reports"].forEach(t=>{
document.getElementById(t).classList.add("hidden");
document.getElementById(t+"Tab").classList.remove("active");
});
document.getElementById(tab).classList.remove("hidden");
document.getElementById(tab+"Tab").classList.add("active");
}

/* ATHLETES */
function addAthlete(){
const name=document.getElementById("name").value;
const grade=document.getElementById("grade").value;
const years=document.getElementById("years").value;
const events=document.getElementById("events").value;
const seasons=[...document.getElementById("seasons").selectedOptions].map(o=>o.value);

if(!name) return;

athletes.push({name,grade,years,events,seasons});
save(); renderAthletes(); updateDropdowns();
}

function renderAthletes(){
let html="";
athletes.forEach((a,i)=>{
html+=`<div class="card">
<b>${a.name}</b><br>
${a.grade} | ${a.events}<br>
<button onclick="deleteAthlete(${i})">Delete</button>
</div>`;
});
document.getElementById("athleteList").innerHTML=html;
}

function deleteAthlete(i){
athletes.splice(i,1);
save(); renderAthletes(); updateDropdowns();
}

/* WORKOUTS */
function addWorkout(){
const w={
title:wTitle.value,
date:wDate.value,
desc:wDesc.value,
assign:assignTo.value
};
if(!w.title||!w.date) return;
workouts.push(w);
save(); renderWorkouts();
}

function renderWorkouts(){
let html="";
workouts.forEach((w,i)=>{
html+=`<div class="card">
<b>${w.title}</b> (${w.date})<br>
${w.desc}<br>
Assigned: ${getAthleteName(w.assign)}
<br><button onclick="editWorkout(${i})">Edit</button>
</div>`;
});
workoutList.innerHTML=html;
}

function editWorkout(i){
const w=workouts[i];
wTitle.value=w.title;
wDate.value=w.date;
wDesc.value=w.desc;
assignTo.value=w.assign;
workouts.splice(i,1);
save(); renderWorkouts();
}

/* CALENDAR */
function renderCalendar(){
const month=document.getElementById("monthPicker").value;
if(!month) return;

const [y,m]=month.split("-");
const days=new Date(y,m,0).getDate();

let html="";
for(let d=1; d<=days; d++){
let date=`${month}-${String(d).padStart(2,'0')}`;
html+=`<div class="calendar-day" onclick="showDay('${date}')">${d}</div>`;
}
calendarGrid.innerHTML=html;
}

function showDay(date){
let dayWorkouts=workouts.filter(w=>w.date===date);

let html=`<b>${date}</b><br>`;
dayWorkouts.forEach((w,i)=>{
html+=`
<div class="card">
<b>${w.title}</b><br>
${w.desc}<br>
Assigned: ${getAthleteName(w.assign)}
<br><button onclick="editWorkout(${i})">Edit</button>
</div>`;
});
dayDetails.innerHTML=html || "No workouts";
}

/* REPORTS */
function generateReport(){
const date=reportDate.value;
const athlete=reportAthlete.value;

let filtered=workouts.filter(w=>{
return (!date || w.date===date) &&
(athlete==="all" || w.assign===athlete || w.assign==="all");
});

let html="";
filtered.forEach(w=>{
html+=`<div class="card">
<b>${w.title}</b><br>
${w.date}<br>
${w.desc}<br>
Assigned: ${getAthleteName(w.assign)}
</div>`;
});

reportOutput.innerHTML=html || "No results";
}

/* HELPERS */
function updateDropdowns(){
assignTo.innerHTML='<option value="all">All Athletes</option>';
reportAthlete.innerHTML='<option value="all">All Athletes</option>';

athletes.forEach((a,i)=>{
assignTo.innerHTML+=`<option value="${i}">${a.name}</option>`;
reportAthlete.innerHTML+=`<option value="${i}">${a.name}</option>`;
});
}

function getAthleteName(i){
if(i==="all") return "All Athletes";
return athletes[i]?.name || "Unknown";
}

/* INIT */
renderAthletes();
renderWorkouts();
updateDropdowns();
</script>

</body>
</html>
