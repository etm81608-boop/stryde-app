<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stryde Elite - Pro Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .active-tab { border-bottom: 4px solid #2563eb; color: #2563eb; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .label-xs { font-size: 9px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; }
        
        @media print {
            nav, aside, .no-print, button { display: none !important; }
            .print-area { display: block !important; width: 100% !important; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; font-size: 10pt; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 overflow-x-hidden">

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-xl no-print">
        <div class="p-4 flex justify-between items-center border-b border-slate-800">
            <h1 class="font-black italic tracking-tighter text-xl text-blue-400">STRYDE ELITE PRO</h1>
            <div class="flex gap-3 items-center">
                <button onclick="jumpToToday()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-full text-[9px] font-black uppercase transition border border-slate-600">Today 📍</button>
                <button onclick="undoLastAction()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-full text-[9px] font-black uppercase transition border border-slate-600">Undo ↩️</button>
                <button onclick="emailAllWorkouts()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-xl transition">Email Blast ✉️</button>
                <div class="flex bg-slate-800 rounded-lg p-1 ml-2">
                    <button id="nav-builder" onclick="switchView('builder')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md active-tab">Builder</button>
                    <button id="nav-library" onclick="switchView('library')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Library</button>
                    <button id="nav-roster" onclick="switchView('roster')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Roster</button>
                    <button id="nav-reports" onclick="switchView('reports')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Reports</button>
                </div>
            </div>
        </div>
        <div class="bg-white p-3 border-b flex gap-3 overflow-x-auto shadow-inner" id="weekRibbon"></div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <aside class="w-full lg:w-96 shrink-0 no-print">
            <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest flex justify-between">
                <span>Selected Day</span>
                <span id="aside-date" class="text-blue-500 font-black"></span>
            </h2>
            <div id="sideRoster" class="space-y-4"></div>
        </aside>

        <section class="flex-1">
            <div id="view-builder" class="space-y-6">
                <div class="card border-t-4 border-blue-600">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-[10px] font-black text-slate-400 uppercase">1. Select Runners</h2>
                        <button onclick="toggleAllCheckboxes('.run-check')" class="text-[9px] font-bold text-blue-600 hover:underline">SELECT ALL</button>
                    </div>
                    <div id="checklist" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-8 max-h-48 overflow-y-auto p-3 bg-slate-50 rounded-xl border"></div>
                    
                    <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4">2. Training Plan</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><span class="label-xs">Warmup</span><input type="text" id="workWarm" class="w-full p-3 border rounded-xl text-sm"></div>
                            <div><span class="label-xs text-orange-500">Drills</span><input type="text" id="workDrills" class="w-full p-3 border rounded-xl text-sm"></div>
                        </div>
                        <div><span class="label-xs text-blue-600 font-bold">Main Set</span><input type="text" id="workMain" class="w-full p-4 border-2 border-blue-100 rounded-xl font-bold text-lg focus:border-blue-500 outline-none"></div>
                        <div class="grid grid-cols-3 gap-4">
                            <div><span class="label-xs text-purple-500">Lift</span><input type="text" id="workLift" class="w-full p-3 border rounded-xl text-sm"></div>
                            <div><span class="label-xs text-cyan-600">Cross Train</span><input type="text" id="workXT" class="w-full p-3 border rounded-xl text-sm"></div>
                            <div><span class="label-xs text-emerald-500">Cooldown</span><input type="text" id="workCool" class="w-full p-3 border rounded-xl text-sm"></div>
                        </div>
                    </div>
                    <button onclick="saveWorkout()" class="w-full bg-slate-900 text-white font-black py-4 rounded-xl mt-8 shadow-lg uppercase text-xs tracking-widest">Assign to Group</button>
                </div>
            </div>

            <div id="view-reports" class="hidden space-y-6">
                <div class="card border-t-4 border-emerald-500 no-print">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4">Export Table</h2>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="rep-start" class="p-3 border rounded-xl font-bold">
                        <input type="date" id="rep-end" class="p-3 border rounded-xl font-bold">
                    </div>
                    <div id="rep-checklist" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4 p-4 bg-slate-50 rounded-xl border"></div>
                    <button onclick="generateReport()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl uppercase text-xs">Generate Schedule</button>
                </div>
                <div id="print-area" class="print-area"></div>
            </div>
            <div id="view-library" class="hidden"><div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
            <div id="view-roster" class="hidden">
                 <div class="card bg-slate-900 text-white mb-6">
                    <input type="text" id="run-name" placeholder="Name" class="p-3 bg-slate-800 rounded-lg text-white mb-2 w-full">
                    <input type="email" id="run-email" placeholder="Email" class="p-3 bg-slate-800 rounded-lg text-white mb-2 w-full">
                    <button onclick="addRunner()" class="bg-blue-600 w-full p-3 rounded-lg font-black uppercase text-xs">Add Athlete</button>
                </div>
                <div id="rosterList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>

    <script>
        // DATE UTILITY: Ensures we use local calendar date, not UTC rollover
        function getLocalDateString(date = new Date()) {
            const offset = date.getTimezoneOffset();
            const local = new Date(date.getTime() - (offset * 60 * 1000));
            return local.toISOString().split('T')[0];
        }

        let selDate = getLocalDateString();
        let lastActionBatchId = null;

        function jumpToToday() {
            selDate = getLocalDateString();
            renderAll();
        }

        function switchView(view) {
            ['builder','library','roster','reports'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', view !== v);
                document.getElementById('nav-'+v).classList.toggle('active-tab', view === v);
            });
            renderAll();
        }

        function saveWorkout() {
            const checked = document.querySelectorAll('.run-check:checked');
            const main = document.getElementById('workMain').value;
            if(!checked.length || !main) return alert("Select runners & Main Set.");
            
            let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            const batchId = Date.now();
            lastActionBatchId = batchId;

            checked.forEach(box => {
                workouts.unshift({
                    id: Math.random().toString(36).substr(2, 9),
                    batch: batchId,
                    date: selDate,
                    name: box.value,
                    main,
                    warm: document.getElementById('workWarm').value,
                    drills: document.getElementById('workDrills').value,
                    lift: document.getElementById('workLift').value,
                    xt: document.getElementById('workXT').value,
                    cool: document.getElementById('workCool').value
                });
            });
            localStorage.setItem('workouts', JSON.stringify(workouts));
            ['workMain','workWarm','workDrills','workLift','workXT','workCool'].forEach(id => document.getElementById(id).value = '');
            renderAll();
        }

        function deleteWorkout(id) {
            let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            renderAll();
        }

        function emailAllWorkouts() {
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]").filter(w => w.date === selDate);
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            if(!workouts.length) return alert("No workouts for " + selDate);
            workouts.forEach(w => {
                const athlete = runners.find(r => r.name === w.name);
                if(athlete?.email) {
                    const body = `Workout for ${selDate}:\n\nMAIN: ${w.main}\nXT: ${w.xt || 'None'}\nLift: ${w.lift || 'None'}`;
                    window.open(`mailto:${athlete.email}?subject=Training Plan&body=${encodeURIComponent(body)}`);
                }
            });
        }

        function renderAll() {
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            const todayWork = workouts.filter(w => w.date === selDate);
            
            document.getElementById('aside-date').innerText = selDate;
            
            // SIDEBAR PREVIEW
            document.getElementById('sideRoster').innerHTML = todayWork.map(w => `
                <div class="card border-2 relative group p-4">
                    <button onclick="deleteWorkout('${w.id}')" class="absolute top-3 right-3 text-red-400 no-print">🗑️</button>
                    <div class="text-[10px] font-black text-blue-600 mb-1 uppercase">${w.name}</div>
                    <div class="text-sm font-black mb-2">${w.main}</div>
                    <div class="grid gap-1 text-[10px] text-slate-500">
                        ${w.warm ? `<div><b>WARM:</b> ${w.warm}</div>` : ''}
                        ${w.xt ? `<div><b>XT:</b> ${w.xt}</div>` : ''}
                        ${w.lift ? `<div><b>LIFT:</b> ${w.lift}</div>` : ''}
                    </div>
                </div>`).join('') || '<div class="text-slate-400 text-center py-10 italic">No activity today.</div>';

            // CHECKLISTS
            document.getElementById('checklist').innerHTML = runners.map(r => `<label class="flex items-center gap-2 p-2 bg-white border rounded text-[10px] font-black cursor-pointer"><input type="checkbox" class="run-check" value="${r.name}"> ${r.name}</label>`).join('');
            document.getElementById('rep-checklist').innerHTML = runners.map(r => `<label class="flex items-center gap-2 p-2 bg-white border rounded text-[10px] font-black cursor-pointer"><input type="checkbox" class="rep-check" value="${r.name}"> ${r.name}</label>`).join('');
            document.getElementById('rosterList').innerHTML = runners.map(r => `<div class="card flex justify-between"><b>${r.name}</b><span class="text-xs">${r.email}</span></div>`).join('');

            // RIBBON: FIXED DATE LOGIC
            const ribbon = document.getElementById('weekRibbon'); ribbon.innerHTML = '';
            let start = new Date(); 
            start.setDate(start.getDate() - 3); // Center around today
            
            for(let i=0; i<14; i++) { // Show 14 days for more range
                let d = new Date(start);
                d.setDate(d.getDate() + i);
                let dStr = getLocalDateString(d);
                
                const card = document.createElement('div');
                card.className = `min-w-[100px] p-3 rounded-xl border-2 cursor-pointer bg-white transition ${dStr === selDate ? 'border-blue-500 shadow-md ring-2 ring-blue-50' : 'border-slate-100 hover:border-slate-300'}`;
                card.onclick = () => { selDate = dStr; renderAll(); };
                card.innerHTML = `<div class="text-[9px] font-black ${dStr === getLocalDateString() ? 'text-blue-600' : 'text-slate-400'} uppercase">${d.toLocaleDateString(undefined, {weekday:'short', day:'numeric'})}</div>`;
                ribbon.appendChild(card);
            }
        }

        function addRunner() {
            let r = JSON.parse(localStorage.getItem('runners') || "[]");
            r.push({ id: Date.now(), name: document.getElementById('run-name').value, email: document.getElementById('run-email').value });
            localStorage.setItem('runners', JSON.stringify(r));
            document.getElementById('run-name').value = '';
            document.getElementById('run-email').value = '';
            renderAll();
        }

        function toggleAllCheckboxes(cls) { const boxes = document.querySelectorAll(cls); const all = Array.from(boxes).every(b => b.checked); boxes.forEach(b => b.checked = !all); }
        
        renderAll();
    </script>
</body>
</html>
