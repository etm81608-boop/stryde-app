<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stryde Elite - Master Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .active-tab { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e2e8f0; border: 1px solid #e2e8f0; }
        .cal-day { min-height: 120px; background: white; padding: 8px; transition: background 0.2s; }
        .cal-day:hover { background: #f8fafc; }
        .cal-today { background: #eff6ff; }
        .workout-pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-xl">
        <div class="p-4 flex justify-between items-center border-b border-slate-800">
            <h1 class="font-black italic tracking-tighter text-xl text-blue-400 uppercase">Stryde Elite</h1>
            <div class="flex bg-slate-800 rounded-lg p-1">
                <button id="nav-builder" onclick="switchView('builder')" class="text-[10px] font-bold uppercase px-4 py-2 rounded-md">Builder</button>
                <button id="nav-calendar" onclick="switchView('calendar')" class="text-[10px] font-bold uppercase px-4 py-2 rounded-md active-tab">Calendar View 📅</button>
                <button id="nav-reports" onclick="switchView('reports')" class="text-[10px] font-bold uppercase px-4 py-2 rounded-md">Reports</button>
                <button id="nav-roster" onclick="switchView('roster')" class="text-[10px] font-bold uppercase px-4 py-2 rounded-md">Roster</button>
            </div>
        </div>
    </nav>

    <main id="view-calendar" class="p-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 id="monthLabel" class="text-2xl font-black text-slate-800 uppercase italic">Month</h2>
            <div class="flex gap-2">
                <button onclick="changeMonth(-1)" class="p-2 bg-white border rounded-lg hover:bg-slate-50">⬅️</button>
                <button onclick="currMonth = new Date(); renderCalendar();" class="px-4 py-2 bg-white border rounded-lg text-xs font-bold uppercase">Today</button>
                <button onclick="changeMonth(1)" class="p-2 bg-white border rounded-lg hover:bg-slate-50">➡️</button>
            </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
            <div class="grid grid-cols-7 bg-slate-100 border-b">
                <template if="days">
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Sun</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Mon</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Tue</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Wed</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Thu</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Fri</div>
                    <div class="p-3 text-[10px] font-black text-slate-500 text-center uppercase tracking-widest">Sat</div>
                </template>
            </div>
            <div id="calendarGrid" class="cal-grid"></div>
        </div>
    </main>

    <div id="view-builder" class="hidden p-6 text-center text-slate-400">Go to Builder Tab to add workouts.</div>
    <div id="view-reports" class="hidden p-6 text-center text-slate-400">Reports Section.</div>
    <div id="view-roster" class="hidden p-6 text-center text-slate-400">Roster Management.</div>

    <div id="editModal" class="modal-overlay fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-black uppercase text-slate-800" id="editAthleteName">Edit Workout</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-900 text-xl">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div><label class="text-[9px] font-black text-slate-400 uppercase">Main Set</label>
                <input type="text" id="editMain" class="w-full p-3 border rounded-xl font-bold text-blue-600 focus:ring-2 ring-blue-500 outline-none"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black text-slate-400 uppercase">Warmup</label>
                    <input type="text" id="editWarm" class="w-full p-3 border rounded-xl text-sm"></div>
                    <div><label class="text-[9px] font-black text-slate-400 uppercase">Lift</label>
                    <input type="text" id="editLift" class="w-full p-3 border rounded-xl text-sm"></div>
                </div>
            </div>
            <div class="p-6 bg-slate-50 flex gap-3">
                <button onclick="updateWorkout()" class="flex-1 bg-blue-600 text-white font-black py-3 rounded-xl uppercase text-xs">Save Changes</button>
                <button onclick="deleteInCal()" class="bg-red-50 text-red-600 font-black px-6 py-3 rounded-xl uppercase text-xs">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let currMonth = new Date();
        let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");

        function switchView(view) {
            ['builder','calendar','reports','roster'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', view !== v);
                document.getElementById('nav-'+v).classList.toggle('active-tab', view === v);
            });
            if(view === 'calendar') renderCalendar();
        }

        function changeMonth(dir) {
            currMonth.setMonth(currMonth.getMonth() + dir);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('monthLabel');
            grid.innerHTML = '';
            
            const year = currMonth.getFullYear();
            const month = currMonth.getMonth();
            label.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currMonth);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date().toISOString().split('T')[0];

            // Padding for start of month
            for(let i=0; i<firstDay; i++) {
                grid.innerHTML += `<div class="cal-day bg-slate-50/50"></div>`;
            }

            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = dateStr === today;
                
                const dayWorkouts = workouts.filter(w => w.date === dateStr);
                
                let dayHtml = `
                    <div class="cal-day ${isToday ? 'cal-today' : ''}">
                        <div class="text-[10px] font-black mb-2 ${isToday ? 'text-blue-600' : 'text-slate-400'}">${d}</div>
                        <div class="space-y-1">
                            ${dayWorkouts.map(w => `
                                <div onclick="openEditModal('${w.id}')" 
                                     class="workout-pill bg-blue-100 text-blue-700 border border-blue-200 hover:bg-blue-600 hover:text-white transition-colors"
                                     title="${w.name}: ${w.main}">
                                    <b>${w.name}:</b> ${w.main}
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                grid.innerHTML += dayHtml;
            }
        }

        function openEditModal(id) {
            const w = workouts.find(item => item.id === id);
            if(!w) return;
            document.getElementById('editId').value = w.id;
            document.getElementById('editAthleteName').innerText = `Edit: ${w.name}`;
            document.getElementById('editMain').value = w.main;
            document.getElementById('editWarm').value = w.warm || '';
            document.getElementById('editLift').value = w.lift || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function updateWorkout() {
            const id = document.getElementById('editId').value;
            const idx = workouts.findIndex(w => w.id === id);
            if(idx !== -1) {
                workouts[idx].main = document.getElementById('editMain').value;
                workouts[idx].warm = document.getElementById('editWarm').value;
                workouts[idx].lift = document.getElementById('editLift').value;
                localStorage.setItem('workouts', JSON.stringify(workouts));
                closeModal();
                renderCalendar();
            }
        }

        function deleteInCal() {
            const id = document.getElementById('editId').value;
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            closeModal();
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
