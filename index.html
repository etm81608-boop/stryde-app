<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Coach Portal - Grouped Reports</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #ef4444; --green: #16a34a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }
        
        nav { background: #1e293b; padding: 1rem; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        nav button { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        nav button.active { background: var(--primary); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }

        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        /* New Grouped Report Styles */
        .report-section { margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: white; }
        .date-header { background: #334155; color: white; padding: 12px 15px; font-weight: bold; font-size: 1.1rem; display: flex; justify-content: space-between; }
        
        .report-table { width: 100%; border-collapse: collapse; }
        .report-table th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 0.7rem; font-weight: 700; border-bottom: 2px solid #e2e8f0; }
        .report-table th, .report-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        .athlete-name { font-weight: 700; color: var(--primary); width: 25%; }
        .workout-title { font-weight: 600; color: #1e293b; }

        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #cbd5e1; border: 1px solid #cbd5e1; }
        .calendar-header { background: #334155; color: white; padding: 10px; text-align: center; font-weight: bold; }
        .calendar-day { background: white; min-height: 120px; padding: 8px; }
        .cal-workout-block { background: #eff6ff; border-left: 3px solid var(--primary); padding: 4px 8px; margin-bottom: 4px; font-size: 0.7rem; border-radius: 2px; }

        button.primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button.success { background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .share-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 8px; margin-top: 15px; word-break: break-all; font-family: monospace; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav>
    <button onclick="showPage('calendar')" id="btn-calendar" class="active">Calendar</button>
    <button onclick="showPage('workouts')" id="btn-workouts">Assign Workout</button>
    <button onclick="showPage('reports')" id="btn-reports">Reports & Share</button>
    <button onclick="showPage('athletes')" id="btn-athletes">Roster</button>
</nav>

<div class="container">
    
    <div id="page-calendar">
        <div class="card">
            <h2 id="monthLabel" style="text-align: center; margin-top: 0;"></h2>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <div id="page-workouts" class="hidden">
        <div class="card">
            <h2>Assign Workout</h2>
            <input type="date" id="w-date">
            <input type="text" id="w-title" placeholder="Workout Title">
            <textarea id="w-desc" rows="3" placeholder="Instructions..."></textarea>
            <label>Assign to Athletes:</label>
            <div id="athlete-selector" style="max-height:150px; overflow-y:auto; border:1px solid #cbd5e1; border-radius:6px; padding:10px; margin-bottom:10px; background: #fff;"></div>
            <button class="primary" onclick="saveWorkout()">Save Workout</button>
        </div>
    </div>

    <div id="page-reports" class="hidden">
        <div class="card">
            <h2>Training Reports</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Start Date</label>
                    <input type="date" id="rep-start">
                </div>
                <div>
                    <label>End Date</label>
                    <input type="date" id="rep-end">
                </div>
            </div>
            <button class="primary" onclick="generateReport()">Generate Grouped View</button>
            <button class="success" onclick="downloadCSV()">Export to Excel (CSV)</button>
            <button class="success" style="background:#0891b2" onclick="generateShareLink()">Generate Athlete Share Link</button>
            
            <div id="share-display" class="hidden">
                <div class="share-box" id="link-url"></div>
            </div>
        </div>

        <div id="report-container"></div>
    </div>

    <div id="page-athletes" class="hidden">
        <div class="card">
            <h2>Add Athlete</h2>
            <input type="text" id="a-name" placeholder="Name">
            <input type="email" id="a-email" placeholder="Email">
            <button class="primary" onclick="saveAthlete()">Add to Roster</button>
        </div>
        <div class="card">
            <table style="width:100%; border-collapse: collapse;">
                <tbody id="athleteBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let athletes = JSON.parse(localStorage.getItem('roster')) || [];
    let workouts = JSON.parse(localStorage.getItem('trainingPlan')) || [];

    function showPage(id) {
        document.querySelectorAll('.container > div').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('active');
        if(id === 'calendar') renderCalendar();
        if(id === 'workouts') renderAthleteSelector();
        if(id === 'athletes') renderRoster();
    }

    // --- ATHLETE LOGIC ---
    function saveAthlete() {
        const name = document.getElementById('a-name').value;
        const email = document.getElementById('a-email').value;
        if(!name) return;
        athletes.push({name, email});
        localStorage.setItem('roster', JSON.stringify(athletes));
        document.getElementById('a-name').value = '';
        document.getElementById('a-email').value = '';
        renderRoster();
    }

    function renderRoster() {
        const body = document.getElementById('athleteBody');
        body.innerHTML = athletes.map((a, i) => `<tr style="border-bottom: 1px solid #eee"><td><strong>${a.name}</strong></td><td>${a.email}</td></tr>`).join('');
    }

    function renderAthleteSelector() {
        const box = document.getElementById('athlete-selector');
        box.innerHTML = athletes.map(a => `<label style="display:block; margin-bottom:5px;"><input type="checkbox" class="a-check" value="${a.name}"> ${a.name}</label>`).join('');
    }

    // --- WORKOUT LOGIC ---
    function saveWorkout() {
        const selected = Array.from(document.querySelectorAll('.a-check:checked')).map(c => c.value);
        const data = {
            date: document.getElementById('w-date').value,
            title: document.getElementById('w-title').value,
            desc: document.getElementById('w-desc').value,
            assigned: selected
        };
        if(!data.date || !data.title) return alert("Date and Title required");
        workouts.push(data);
        localStorage.setItem('trainingPlan', JSON.stringify(workouts));
        showPage('calendar');
    }

    // --- NEW GROUPED REPORT LOGIC ---
    function generateReport() {
        const start = document.getElementById('rep-start').value;
        const end = document.getElementById('rep-end').value;
        if(!start || !end) return alert("Select a date range");

        const container = document.getElementById('report-container');
        container.innerHTML = '';
        
        // Group workouts by date
        const filtered = workouts.filter(w => w.date >= start && w.date <= end).sort((a,b) => a.date.localeCompare(b.date));
        const grouped = {};
        
        filtered.forEach(w => {
            if (!grouped[w.date]) grouped[w.date] = [];
            grouped[w.date].push(w);
        });

        for (const date in grouped) {
            let section = `
                <div class="report-section">
                    <div class="date-header">📅 ${new Date(date).toDateString()}</div>
                    <table class="report-table">
                        <thead><tr><th>Athlete</th><th>Workout</th><th>Instructions</th></tr></thead>
                        <tbody>`;
            
            grouped[date].forEach(w => {
                w.assigned.forEach(name => {
                    section += `
                        <tr>
                            <td class="athlete-name">${name}</td>
                            <td class="workout-title">${w.title}</td>
                            <td><small>${w.desc}</small></td>
                        </tr>`;
                });
            });

            section += `</tbody></table></div>`;
            container.innerHTML += section;
        }
    }

    function downloadCSV() {
        let csv = "Date,Athlete,Workout,Instructions\n";
        workouts.forEach(w => {
            w.assigned.forEach(name => {
                csv += `"${w.date}","${name}","${w.title}","${w.desc.replace(/"/g, '""')}"\n`;
            });
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('hidden', '');
        a.setAttribute('href', url);
        a.setAttribute('download', 'coach_report.csv');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function generateShareLink() {
        const start = document.getElementById('rep-start').value;
        const end = document.getElementById('rep-end').value;
        const filtered = workouts.filter(w => w.date >= start && w.date <= end);
        const dataString = btoa(unescape(encodeURIComponent(JSON.stringify(filtered))));
        const shareUrl = window.location.origin + window.location.pathname + "#view=" + dataString;
        document.getElementById('link-url').innerText = shareUrl;
        document.getElementById('share-display').classList.remove('hidden');
    }

    window.onload = function() {
        if(window.location.hash.startsWith("#view=")) {
            const data = JSON.parse(decodeURIComponent(escape(atob(window.location.hash.split("=")[1]))));
            document.body.innerHTML = `
                <div class="container">
                    <h1>Athlete Training Schedule</h1>
                    ${data.map(w => `
                        <div class="card">
                            <h3 style="color:var(--primary)">${w.date} - ${w.title}</h3>
                            <p>${w.desc}</p>
                            <small>Assigned to: ${w.assigned.join(', ')}</small>
                        </div>
                    `).join('')}
                    <button class="primary" onclick="window.location.hash=''; location.reload();">Close Schedule</button>
                </div>`;
        }
    }

    function renderCalendar() {

  const month = monthPicker.value;
  if (!month) return;

  const [y, m] = month.split("-");
  const days = new Date(y, m, 0).getDate();

  let html = "";

  // Loop through each day of the month
  for (let d = 1; d <= days; d++) {

    let date = `${month}-${String(d).padStart(2,'0')}`;

    // Find workouts for this specific day
    let dayWorkouts = workouts.filter(w => w.date === date);

    // Start building the calendar cell
    let cellContent = `<b>${d}</b><br>`;

    // Add each workout into the cell
    dayWorkouts.forEach(w => {
      cellContent += `
        <div style="font-size:12px; margin-top:4px;">
          <b>${w.title}</b><br>
          ${getAthleteName(w.assign)}
        </div>
      `;
    });

    // Create the calendar box
    html += `
      <div class="calendar-day" onclick="showDay('${date}')">
        ${cellContent}
      </div>
    `;
  }

  // Render calendar
  calendarGrid.innerHTML = html;
}

        }
    }

    showPage('calendar');
</script>
</body>
</html>
