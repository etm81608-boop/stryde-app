<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stryde Elite - Pro Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .active-tab { border-bottom: 4px solid #2563eb; color: #2563eb; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .event-input { border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 11px; font-weight: bold; width: 100%; text-align: center; }
        .label-xs { font-size: 9px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
        
        @media print {
            nav, aside, .no-print, button { display: none !important; }
            .print-area { display: block !important; width: 100% !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 overflow-x-hidden">

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-xl no-print">
        <div class="p-4 flex justify-between items-center border-b border-slate-800">
            <h1 class="font-black italic tracking-tighter text-xl text-blue-400">STRYDE ELITE PRO</h1>
            <div class="flex gap-3 items-center">
                <button onclick="undoLastAction()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-full text-[10px] font-black uppercase transition border border-slate-600">Undo ↩️</button>
                <button onclick="emailAllWorkouts()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-lg transition">Email Blast ✉️</button>
                <div class="flex bg-slate-800 rounded-lg p-1 ml-2">
                    <button id="nav-builder" onclick="switchView('builder')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md active-tab">Builder</button>
                    <button id="nav-library" onclick="switchView('library')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Library</button>
                    <button id="nav-roster" onclick="switchView('roster')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Roster</button>
                    <button id="nav-reports" onclick="switchView('reports')" class="text-[10px] font-black uppercase px-3 py-2 rounded-md">Reports</button>
                </div>
            </div>
        </div>
        <div class="bg-white p-3 border-b flex gap-3 overflow-x-auto shadow-inner" id="weekRibbon"></div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <aside class="w-full lg:w-80 shrink-0 no-print">
            <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Selected Day's Groups</h2>
            <div id="sideRoster" class="space-y-4"></div>
        </aside>

        <section class="flex-1">
            <div id="view-builder" class="space-y-6">
                <div class="card border-t-4 border-blue-600">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-[10px] font-black text-slate-400 uppercase">1. Select Runners</h2>
                        <button onclick="toggleAllCheckboxes('.run-check')" class="text-[9px] font-bold text-blue-600 hover:underline">SELECT ALL</button>
                    </div>
                    <div id="checklist" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-8 max-h-48 overflow-y-auto p-3 bg-slate-50 rounded-xl border"></div>
                    
                    <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4">2. Training Plan</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><span class="label-xs text-slate-400">Warmup</span><input type="text" id="workWarm" class="w-full p-3 border rounded-xl text-sm font-semibold"></div>
                            <div><span class="label-xs text-orange-500">Drills / Activation</span><input type="text" id="workDrills" class="w-full p-3 border rounded-xl text-sm font-semibold"></div>
                        </div>
                        <div><span class="label-xs text-blue-600">Main Set</span><input type="text" id="workMain" class="w-full p-4 border-2 border-blue-100 rounded-xl font-bold text-lg outline-none focus:border-blue-500"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><span class="label-xs text-purple-500">Lift / Strength</span><input type="text" id="workLift" class="w-full p-3 border rounded-xl text-sm font-semibold"></div>
                            <div><span class="label-xs text-emerald-500">Cooldown</span><input type="text" id="workCool" class="w-full p-3 border rounded-xl text-sm font-semibold"></div>
                        </div>
                    </div>
                    <button onclick="saveWorkout()" class="w-full bg-slate-900 text-white font-black py-4 rounded-xl mt-8 shadow-lg uppercase tracking-widest text-xs">Assign to Group</button>
                </div>
            </div>

            <div id="view-library" class="hidden space-y-6">
                <div class="card bg-purple-50 border-purple-200">
                    <h2 class="font-black text-purple-700 mb-4 uppercase italic text-sm">Library Template</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <input type="text" id="lib-title" placeholder="Template Title" class="w-full p-3 border rounded-xl font-black text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="lib-warm" placeholder="Warmup" class="p-2 border rounded-lg text-xs">
                            <input type="text" id="lib-drills" placeholder="Drills" class="p-2 border rounded-lg text-xs">
                        </div>
                        <input type="text" id="lib-main" placeholder="Main Set" class="w-full p-3 border-2 border-purple-200 rounded-xl font-bold">
                    </div>
                    <button onclick="saveToLibrary()" class="w-full bg-purple-600 text-white font-black py-3 rounded-xl mt-4 text-[10px] uppercase">Save Template</button>
                </div>
                <div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="view-roster" class="hidden space-y-6">
                <div class="card bg-slate-900 text-white border-none shadow-2xl">
                    <h2 id="form-title" class="font-black text-blue-400 mb-6 uppercase italic text-sm">Athlete Intake</h2>
                    <input type="hidden" id="edit-id">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <div class="md:col-span-2"><span class="label-xs">Full Name</span><input type="text" id="run-name" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold"></div>
                        <div><span class="label-xs">Grade</span><select id="run-grade" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold"><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select></div>
                        <div><span class="label-xs">Years</span><input type="number" id="run-years" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white font-bold"></div>
                    </div>
                    <div><span class="label-xs">Email</span><input type="email" id="run-email" class="w-full p-3 bg-slate-800 border-none rounded-xl text-white mb-6"></div>
                    <div id="pr-inputs" class="grid grid-cols-3 md:grid-cols-6 gap-3 mt-2 border-t border-slate-700 pt-4"></div>
                    <div class="flex gap-3 mt-8">
                        <button onclick="addRunner()" id="save-btn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black text-xs uppercase">Save Athlete</button>
                        <button onclick="clearForm()" class="text-slate-500 font-bold text-[10px] uppercase">Clear</button>
                    </div>
                </div>
                <div id="rosterList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="view-reports" class="hidden space-y-6">
                <div id="rep-checklist" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4 p-4 bg-white rounded-xl border"></div>
                <div id="print-area" class="print-area"></div>
            </div>
        </section>
    </main>

    <script>
        let selDate = new Date().toISOString().split('T')[0];
        let lastActionCount = 0; // Tracks how many entries to remove on Undo
        const eventList = ['100', '200', '400', '800', '1600', '3200'];

        document.getElementById('pr-inputs').innerHTML = eventList.map(ev => `<div><span class="text-[8px] font-bold block text-center uppercase text-slate-500">${ev}</span><input type="text" id="pr-${ev}" class="event-input bg-slate-800 border-none text-white"></div>`).join('');

        function switchView(view) {
            ['builder','library','roster','reports'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', view !== v);
                document.getElementById('nav-'+v).classList.toggle('active-tab', view === v);
            });
            renderAll();
        }

        function saveWorkout() {
            const checked = document.querySelectorAll('.run-check:checked');
            const main = document.getElementById('workMain').value;
            if(!checked.length || !main) return alert("Select runners & Main Set.");
            
            let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            lastActionCount = checked.length; // Set for Undo feature

            checked.forEach(box => {
                workouts.unshift({
                    date: selDate,
                    name: box.value,
                    main,
                    warm: document.getElementById('workWarm').value,
                    drills: document.getElementById('workDrills').value,
                    lift: document.getElementById('workLift').value,
                    cool: document.getElementById('workCool').value
                });
            });
            localStorage.setItem('workouts', JSON.stringify(workouts));
            ['workMain','workWarm','workDrills','workLift','workCool'].forEach(id => document.getElementById(id).value = '');
            renderAll();
        }

        function undoLastAction() {
            if(lastActionCount === 0) return alert("Nothing to undo.");
            let workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            workouts.splice(0, lastActionCount);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            lastActionCount = 0;
            renderAll();
            alert("Last assignment undone.");
        }

        function useLibrary(libId) {
            const lib = JSON.parse(localStorage.getItem('library') || "[]");
            const w = lib.find(l => l.id === libId);
            document.getElementById('workWarm').value = w.warm;
            document.getElementById('workDrills').value = w.drills || '';
            document.getElementById('workMain').value = w.main;
            document.getElementById('workLift').value = w.lift || '';
            document.getElementById('workCool').value = w.cool || '';
            switchView('builder');
        }

        function emailAllWorkouts() {
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]").filter(w => w.date === selDate);
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            workouts.forEach(w => {
                const r = runners.find(item => item.name === w.name);
                if(r?.email) {
                    const body = `Plan for ${selDate}:\n\nWarm: ${w.warm}\nDrills: ${w.drills}\nMAIN: ${w.main}\nLift: ${w.lift}\nCool: ${w.cool}`;
                    window.open(`mailto:${r.email}?subject=Workout&body=${encodeURIComponent(body)}`);
                }
            });
        }

        function renderAll() {
            const runners = JSON.parse(localStorage.getItem('runners') || "[]");
            const workouts = JSON.parse(localStorage.getItem('workouts') || "[]");
            const lib = JSON.parse(localStorage.getItem('library') || "[]");

            document.getElementById('rosterList').innerHTML = runners.map(r => `<div class="card mb-2 flex justify-between"><b>${r.name}</b><button onclick="editAthlete(${r.id})" class="text-[9px] font-black uppercase">Edit</button></div>`).join('');
            document.getElementById('checklist').innerHTML = runners.map(r => `<label class="flex items-center gap-2 p-2 bg-white border rounded text-[10px] font-black"><input type="checkbox" class="run-check" value="${r.name}"> ${r.name}</label>`).join('');
            document.getElementById('libraryList').innerHTML = lib.map(l => `<div class="card mb-2 flex justify-between items-center"><span class="font-black text-xs uppercase">${l.title}</span><button onclick="useLibrary(${l.id})" class="bg-purple-100 p-2 rounded text-[9px] font-black">LOAD</button></div>`).join('');

            const today = workouts.filter(w => w.date === selDate);
            document.getElementById('sideRoster').innerHTML = today.map(w => `<div class="p-4 bg-white border rounded-xl border-l-4 border-blue-500 shadow-sm"><div class="text-[10px] font-black text-blue-600 uppercase mb-1">${w.name}</div><div class="text-[11px] font-bold">${w.main}</div></div>`).join('') || '<p class="text-xs italic text-slate-400">No activity.</p>';

            const ribbon = document.getElementById('weekRibbon'); ribbon.innerHTML = '';
            let start = new Date(); start.setDate(start.getDate() - 3);
            for(let i=0; i<7; i++) {
                let d = new Date(start); d.setDate(d.getDate() + i);
                let dStr = d.toISOString().split('T')[0];
                const card = document.createElement('div');
                card.className = `min-w-[100px] p-2 rounded-xl border-2 cursor-pointer bg-white ${dStr === selDate ? 'border-blue-500' : 'border-slate-100'}`;
                card.onclick = () => { selDate = dStr; renderAll(); };
                card.innerHTML = `<div class="text-[8px] font-black text-slate-400 uppercase">${d.toLocaleDateString(undefined, {weekday:'short', day:'numeric'})}</div>`;
                ribbon.appendChild(card);
            }
        }

        function saveToLibrary() {
            let lib = JSON.parse(localStorage.getItem('library') || "[]");
            lib.push({ id: Date.now(), title: document.getElementById('lib-title').value, warm: document.getElementById('lib-warm').value, drills: document.getElementById('lib-drills').value, main: document.getElementById('lib-main').value });
            localStorage.setItem('library', JSON.stringify(lib));
            renderAll();
        }

        function addRunner() {
            let r = JSON.parse(localStorage.getItem('runners') || "[]");
            r.push({ id: Date.now(), name: document.getElementById('run-name').value, email: document.getElementById('run-email').value, grade: document.getElementById('run-grade').value, years: document.getElementById('run-years').value });
            localStorage.setItem('runners', JSON.stringify(r));
            clearForm(); renderAll();
        }

        function clearForm() { document.getElementById('run-name').value = ''; document.getElementById('run-email').value = ''; }
        function toggleAllCheckboxes(cls) { const boxes = document.querySelectorAll(cls); const all = Array.from(boxes).every(b => b.checked); boxes.forEach(b => b.checked = !all); }
        renderAll();
    </script>
</body>
</html>
